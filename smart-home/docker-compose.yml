version: "2.1"

volumes:
  home-assistant-config:
  mosquitto-config:
  mosquitto-data:
  mosquitto-log:
  otbr-data:
  matter-data:

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.1.0
    network_mode: host
    privileged: true
    mem_limit: 500m
    mem_reservation: 450m
    memswap_limit: 612m
    labels:
      io.balena.features.dbus: "1"
    volumes:
      - home-assistant-config:/config
    environment:
      - TZ=Europe/Athens # Set your timezone here instead of mounting /etc/localtime
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0 # Zigbee stick
      # - /dev/ttyUSB1:/dev/ttyUSB1 # Thread/Matter stick - Handled in otbr
      - /dev/ttyAMA0:/dev/ttyAMA0 # Add this for Bluetooth
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN # Add this for Bluetooth access
    restart: unless-stopped

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    network_mode: host
    mem_limit: 100m
    mem_reservation: 50m
    memswap_limit: 200m
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  otbr:
    image: openthread/otbr:latest
    container_name: otbr
    network_mode: host
    privileged: true
    mem_limit: 100m
    mem_reservation: 50m
    memswap_limit: 200m
    restart: unless-stopped
    environment:
      DEVICE: "/dev/ttyUSB1" # adjust if your stick shows as another device
      BAUDRATE: "115200" # check firmware docs
      FLOW_CONTROL: "0" # ← DISABLE (was '1')
      DEVICE_RESET: "1" # ← FORCE reset
      BACKBONE_IF: "eth0" # your Pi’s main interface (eth0 or wlan0)
      OTBR_WEB_PORT: "8080"
    devices:
      - /dev/ttyACM0:/dev/ttyUSB1
    volumes:
      - otbr-data:/data

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    network_mode: host
    mem_limit: 100m
    mem_reservation: 50m
    memswap_limit: 200m
    restart: unless-stopped
    privileged: true
    security_opt:
      - apparmor:unconfined
    volumes:
      - matter-data:/data
    devices:
      - /dev/hci0:/dev/hci0 # if you use Bluetooth on the host; optional
    command: >
      --storage-path /data
      --paa-root-cert-dir /data/credentials
      --bluetooth-adapter 0
